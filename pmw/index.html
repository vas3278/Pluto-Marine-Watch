<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMW</title><style>body{background:#101c26;color:#e3edf4;font:16px system-ui;max-width:1000px;margin:30px auto;padding:15px}article{border:1px solid #405665;padding:16px;margin:12px 0;border-radius:8px}input,select,button{background:#203745;color:white;padding:10px;border:1px solid #58717f;border-radius:5px}small{color:#b6c7d3}#health{color:#ffcf82}</style><h1>Pluto Marine Watch</h1><p id="health">Стендовый режим — реальные данные отсутствуют</p><section id="nav"></section><label>Масштаб, мили <select id="range"><option>2</option><option>5</option><option>10</option></select></label> <label>Ориентация <select id="orientation"><option value="north">Север</option><option value="heading">Курс</option></select></label><canvas id="plot" width="480" height="480" style="width:100%;max-width:480px"></canvas><p id="details"></p><input id="q" placeholder="Поиск"><select id="ch"><option value="">Все каналы</option><option>16</option><option>13</option><option>12</option></select><main id="log"></main><script>
const el=id=>document.getElementById(id); async function load(){try{const p=new URLSearchParams({q:el('q').value});if(el('ch').value)p.set('channel',el('ch').value);const r=await fetch('/api/v1/radio/events?'+p);if(!r.ok)throw Error();const rows=await r.json();el('log').replaceChildren();for(const x of rows){const a=document.createElement('article');for(const t of [x.time+' UTC | CH '+x.channel+' | '+x.frequency_hz/1e6+' MHz',x.sender+' → '+x.recipient,x.text,'СИМУЛЯЦИЯ | '+x.status]){const d=document.createElement('p');d.textContent=t;a.append(d)}const s=document.createElement('select');for(const [v,t] of [['new','Новый'],['reviewed','Просмотрен'],['requires_reply','Требует ответа'],['handled','Обработан']])s.add(new Option(t,v));s.value=x.status;s.onchange=async()=>{await fetch('/api/v1/radio/events/'+x.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});load()};a.append(s);el('log').append(a)}if(!rows.length)el('log').textContent='Нет записей';}catch(e){el('log').textContent='Ошибка доступа к журналу'}}let selected=null;function plot(x){const c=el('plot'),g=c.getContext('2d'),r=Number(el('range').value),o=x.navigation,angle=el('orientation').value==='heading'?o.heading*Math.PI/180:0;g.clearRect(0,0,480,480);g.strokeStyle='#58717f';for(let i=1;i<=4;i++){g.beginPath();g.arc(240,240,55*i,0,2*Math.PI);g.stroke()}g.fillStyle='white';g.fillText('СИМУЛЯЦИЯ',10,15);g.fillText(el('orientation').value==='heading'?'HDG ↑':'N ↑',230,15);g.fillRect(236,236,8,8);const points=[];for(const t of x.targets){const px=240+220/r*(t.east_nm*Math.cos(angle)-t.north_nm*Math.sin(angle)),py=240-220/r*(t.east_nm*Math.sin(angle)+t.north_nm*Math.cos(angle));if(Math.hypot(px-240,py-240)>220)continue;points.push([px,py,t]);g.fillStyle=t.id===selected?'#ffcf82':'#80d9ef';g.fillRect(px-4,py-4,8,8);g.fillText(t.name,px+6,py)}c.onclick=e=>{const b=c.getBoundingClientRect(),px=(e.clientX-b.left)*480/b.width,py=(e.clientY-b.top)*480/b.height;const hit=points.find(p=>Math.hypot(p[0]-px,p[1]-py)<15);selected=hit?hit[2].id:null;plot(x)};const t=x.targets.find(t=>t.id===selected);const f=v=>v==null?'—':v.toFixed(2);el('details').textContent=t?[t.name,'Дистанция '+f(t.distance_nm)+' NM','Пеленг '+f(t.bearing_deg)+'°','Относительный '+f(t.relative_bearing_deg)+'°','CPA '+f(t.cpa_nm)+' NM','TCPA '+f(t.tcpa_min)+' min'].join(' | '):'Выберите цель'}async function nav(){try{const r=await fetch('/api/v1/simulation');if(!r.ok)throw Error();const x=await r.json();if(!x.simulated)throw Error();const o=x.navigation;el('nav').textContent=['СИМУЛЯЦИЯ — НЕ ДЛЯ НАВИГАЦИИ',o.name,'HDG '+o.heading,'COG '+o.cog,'SOG '+o.sog+' kn',o.position.lat.toFixed(5)+', '+o.position.lon.toFixed(5),...x.nmea].join(' | ');plot(x)}catch(e){el('nav').textContent='Навигационные данные недоступны';el('plot').getContext('2d').clearRect(0,0,480,480);el('plot').onclick=null;el('details').textContent=''}}nav();setInterval(nav,1000);el('q').oninput=load;el('ch').onchange=load;load();</script></html>
