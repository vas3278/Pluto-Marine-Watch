<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMW</title><style>body{background:#101c26;color:#e3edf4;font:16px system-ui;max-width:1000px;margin:30px auto;padding:15px}article{border:1px solid #405665;padding:16px;margin:12px 0;border-radius:8px}input,select,button{background:#203745;color:white;padding:10px;border:1px solid #58717f;border-radius:5px}small{color:#b6c7d3}#health{color:#ffcf82}</style><h1>Pluto Marine Watch</h1><p id="health">Стендовый режим — реальные данные отсутствуют</p><input id="q" placeholder="Поиск"><select id="ch"><option value="">Все каналы</option><option>16</option><option>13</option><option>12</option></select><main id="log"></main><script>
const el=id=>document.getElementById(id); async function load(){try{const p=new URLSearchParams({q:el('q').value});if(el('ch').value)p.set('channel',el('ch').value);const r=await fetch('/api/v1/radio/events?'+p);if(!r.ok)throw Error();const rows=await r.json();el('log').replaceChildren();for(const x of rows){const a=document.createElement('article');for(const t of [x.time+' UTC | CH '+x.channel+' | '+x.frequency_hz/1e6+' MHz',x.sender+' → '+x.recipient,x.text,'СИМУЛЯЦИЯ | '+x.status]){const d=document.createElement('p');d.textContent=t;a.append(d)}const s=document.createElement('select');for(const [v,t] of [['new','Новый'],['reviewed','Просмотрен'],['requires_reply','Требует ответа'],['handled','Обработан']])s.add(new Option(t,v));s.value=x.status;s.onchange=async()=>{await fetch('/api/v1/radio/events/'+x.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});load()};a.append(s);el('log').append(a)}if(!rows.length)el('log').textContent='Нет записей';}catch(e){el('log').textContent='Ошибка доступа к журналу'}}el('q').oninput=load;el('ch').onchange=load;load();</script></html>
